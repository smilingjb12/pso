<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141c2a;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e8f0ff;
      }
      .cell-label {
        position: absolute;
        pointer-events: none;
        padding: 8px 12px;
        max-width: 30vw;
      }
      .cell-label b {
        font-size: 18px;
        color: #ffd75a;
        margin-right: 6px;
      }
      .cell-label span {
        font-size: 15px;
        font-weight: 600;
      }
      .cell-label div {
        font-size: 12px;
        color: #a8bce0;
        margin-top: 2px;
      }
      .cell-border.picked {
        border: 2px solid #ffd75a;
        box-shadow: inset 0 0 24px rgba(255, 215, 90, 0.18);
      }
      .cell-border.picked::after {
        content: 'current pick';
        position: absolute;
        right: 8px;
        top: 6px;
        font-size: 12px;
        color: #ffd75a;
      }
      #picks {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        background: rgba(10, 16, 28, 0.82);
        border: 1px solid rgba(120, 160, 230, 0.4);
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 14px;
        pointer-events: none;
        white-space: nowrap;
        text-align: center;
      }
      #picks b {
        color: #ffd75a;
      }
      .cell-border {
        position: absolute;
        pointer-events: none;
        border: 1px solid rgba(120, 160, 230, 0.25);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="picks"></div>
    <script type="module" src="/src/charlab.ts"></script>
  </body>
</html>
