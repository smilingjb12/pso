<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141c2a;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e8f0ff;
      }
      .cell-label {
        position: absolute;
        pointer-events: none;
        padding: 8px 12px;
        max-width: 30vw;
      }
      .cell-label b {
        font-size: 18px;
        color: #ffd75a;
        margin-right: 6px;
      }
      .cell-label span {
        font-size: 15px;
        font-weight: 600;
      }
      .cell-label div {
        font-size: 12px;
        color: #a8bce0;
        margin-top: 2px;
      }
      .cell-border {
        position: absolute;
        pointer-events: none;
        border: 1px solid rgba(120, 160, 230, 0.25);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/runlab.ts"></script>
  </body>
</html>
